<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" role="img" aria-label="RAF Cloud architecture: Angular client, Spring Boot server with custom JWT and AOP security, WebSocket status updates">
<title>RAF Cloud architecture: Angular client, Spring Boot server with custom JWT and AOP security, WebSocket status updates</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="780" height="540" fill="#0a0a0a"/><rect width="780" height="540" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">RAF CLOUD · ARCHITECTURE</text><rect x="30" y="120" width="200" height="64" fill="#111113" stroke="#3a3a40"/><text x="130.0" y="149.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Angular client</text><text x="130.0" y="166.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">permission-driven UI</text><rect x="300" y="70" width="440" height="330" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="316" y="92" font-size="11" fill="#8d8d94" text-anchor="start">Spring Boot server (Kotlin)</text><rect x="320" y="110" width="190" height="60" fill="#1a0f09" stroke="#ff4f00"/><text x="415.0" y="137.0" text-anchor="middle" font-size="13" fill="#f2f2f2">JWT + AOP</text><text x="415.0" y="154.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">custom security</text><rect x="530" y="110" width="190" height="60" fill="#111113" stroke="#3a3a40"/><text x="625.0" y="137.0" text-anchor="middle" font-size="13" fill="#f2f2f2">RBAC</text><text x="625.0" y="154.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">per-action permissions</text><rect x="320" y="200" width="190" height="60" fill="#111113" stroke="#3a3a40"/><text x="415.0" y="227.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Machine service</text><text x="415.0" y="244.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">start / stop / restart</text><rect x="530" y="200" width="190" height="60" fill="#111113" stroke="#3a3a40"/><text x="625.0" y="227.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Scheduler</text><text x="625.0" y="244.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">future operations</text><rect x="320" y="300" width="190" height="60" fill="#111113" stroke="#3a3a40"/><text x="415.0" y="327.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Async executor</text><text x="415.0" y="344.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">10+ s operations</text><rect x="530" y="300" width="190" height="60" fill="#111113" stroke="#3a3a40"/><text x="625.0" y="327.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Error log</text><text x="625.0" y="344.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">failed schedules</text><rect x="420" y="450" width="200" height="56" fill="#111113" stroke="#3a3a40"/><text x="520.0" y="475.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Database</text><text x="520.0" y="492.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">users, machines</text><line x1="230" y1="140" x2="318" y2="140" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="274" y="132" text-anchor="middle" font-size="10.5" fill="#8d8d94">REST + JWT</text><line x1="415" y1="170" x2="415" y2="198" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="415" y1="260" x2="415" y2="298" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="625" y1="260" x2="625" y2="298" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="520" y1="400" x2="520" y2="448" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><path d="M318 330 C 250 330, 170 260, 140 186" fill="none" stroke="#ff4f00" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#b)"/><text x="120" y="300" font-size="10.5" fill="#ff6a2b" text-anchor="start">WebSocket: status pushed</text><text x="120" y="316" font-size="10.5" fill="#ff6a2b" text-anchor="start">when an operation ends</text></g></svg>