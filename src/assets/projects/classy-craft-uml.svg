nt-size="12" fill="#f2f2f2">3 interclasses</text><line x1="300" y1="506" x2="430" y2="506" stroke="#3a3a40"/><text x="308" y="522" font-size="10" fill="#8d8d94" text-anchor="start">ClassInterClass</text><text x="308" y="537" font-size="10" fill="#8d8d94" text-anchor="start">InterfaceInterclass</text><text x="308" y="552" font-size="10" fill="#8d8d94" text-anchor="start">EnumInterclass</text><rect x="440" y="480" width="110" height="96" fill="#111113" stroke="#3a3a40"/><text x="495.0" y="497" text-anchor="middle" font-size="12" fill="#f2f2f2">4 connections</text><line x1="440" y1="506" x2="550" y2="506" stroke="#3a3a40"/><text x="448" y="522" font-size="10" fill="#8d8d94" text-anchor="start">Aggregation</text><text x="448" y="537" font-size="10" fill="#8d8d94" text-anchor="start">Composition</text><text x="448" y="552" font-size="10" fill="#8d8d94" text-anchor="start">Dependency</text><text x="448" y="567" font-size="10" fill="#8d8d94" text-anchor="start">Generalization</text><path d="M365 480 L 365 436" fill="none" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#t)"/><path d="M495 480 L 495 436" fill="none" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#t)"/><text x="40" y="370" text-anchor="start" font-size="10.5" fill="#ff6a2b">A Diagram&#x27;s children are its</text><text x="40" y="385" text-anchor="start" font-size="10.5" fill="#ff6a2b">DiagramElements, so the whole</text><text x="40" y="400" text-anchor="start" font-size="10.5" fill="#ff6a2b">project is one tree.</text><text x="40" y="470" text-anchor="start" font-size="10.5" fill="#8d8d94">Project, MyPackage, Diagram</text><text x="40" y="485" text-anchor="start" font-size="10.5" fill="#8d8d94">and Interclass are IPublishers:</text><text x="40" y="500" text-anchor="start" font-size="10.5" fill="#8d8d94">the tree and the diagram views</text><text x="40" y="515" text-anchor="start" font-size="10.5" fill="#8d8d94">subscribe and repaint on change.</text><text x="40" y="590" text-anchor="start" font-size="10.5" fill="#8d8d94">Factory Method builds tree nodes; Singleton holds application state.</text><rect x="580" y="54" width="380" height="250" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="594" y="74" font-size="11" fill="#8d8d94" text-anchor="start">State: one object per canvas tool</text><rect x="600" y="88" width="150" height="66" fill="#1a0f09" stroke="#ff4f00"/><text x="675.0" y="105" text-anchor="middle" font-size="12" fill="#f2f2f2">StateManager</text><line x1="600" y1="114" x2="750" y2="114" stroke="#ff4f00"/><text x="608" y="130" font-size="10" fill="#8d8d94" text-anchor="start">currentState</text><text x="608" y="145" font-size="10" fill="#8d8d94" text-anchor="start">setXxxState()</text><rect x="790" y="84" width="150" height="89" fill="#111113" stroke="#3a3a40"/><text x="865.0" y="97" text-anchor="middle" font-size="9.5" fill="#8d8d94">«interface»</text><text x="865.0" y="111" text-anchor="middle" font-size="12" fill="#f2f2f2" font-style="italic">State</text><line x1="790" y1="118" x2="940" y2="118" stroke="#3a3a40"/><text x="798" y="134" font-size="10" fill="#8d8d94" text-anchor="start">mousePressed()</text><text x="798" y="149" font-size="10" fill="#8d8d94" text-anchor="start">mouseReleased()</text><text x="798" y="164" font-size="10" fill="#8d8d94" text-anchor="start">mouseDragged()</text><line x1="750" y1="110" x2="788" y2="110" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="600" y="200" width="340" height="66" fill="#111113" stroke="#3a3a40"/><text x="770.0" y="217" text-anchor="middle" font-size="12" fill="#f2f2f2">9 concrete states</text><line x1="600" y1="226" x2="940" y2="226" stroke="#3a3a40"/><text x="608" y="242" font-size="10" fill="#8d8d94" text-anchor="start">Selection, AddClass, AddConnection, Move, EditClass,</text><text x="608" y="257" font-size="10" fill="#8d8d94" text-anchor="start">Duplicate, Remove, ZoomIn, ZoomOut</text><path d="M865 200 L 865 166" fill="none" stroke="#5c5c63" stroke-width="1.3" 