<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="Parallel image processing: a command loop starts one thread per command; process turns JSON task files into tasks run by a process pool, and every result is recorded in the image registry">
<title>Parallel image processing: a command loop starts one thread per command; process turns JSON task files into tasks run by a process pool, and every result is recorded in the image registry</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1L11 6L1 11z" fill="#0a0a0a" stroke="#5c5c63" stroke-width="1.2"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="940" height="520" fill="#0a0a0a"/><rect width="940" height="520" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">PARALLEL IMAGE PROCESSING · THREADS, PROCESSES, REGISTRY</text><rect x="30" y="70" width="200" height="64" fill="#111113" stroke="#3a3a40"/><text x="130.0" y="91.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Command loop</text><text x="130.0" y="108.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">add · process · delete</text><text x="130.0" y="123.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">list · describe · exit</text><text x="30" y="160" text-anchor="start" font-size="10.5" fill="#8d8d94">each command runs</text><text x="30" y="175" text-anchor="start" font-size="10.5" fill="#8d8d94">in its own thread</text><rect x="290" y="70" width="190" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="385.0" y="91.0" text-anchor="middle" font-size="13" fill="#f2f2f2">process</text><text x="385.0" y="108.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">JSON task files</text><text x="385.0" y="123.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">→ Task: Waiting</text><rect x="290" y="250" width="190" height="52" fill="#111113" stroke="#3a3a40"/><text x="385.0" y="273.0" text-anchor="middle" font-size="13" fill="#f2f2f2">add</text><text x="385.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">copy original in</text><rect x="290" y="320" width="190" height="52" fill="#111113" stroke="#3a3a40"/><text x="385.0" y="343.0" text-anchor="middle" font-size="13" fill="#f2f2f2">delete</text><text x="385.0" y="360.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">waits while filtering</text><rect x="290" y="390" width="190" height="52" fill="#111113" stroke="#3a3a40"/><text x="385.0" y="413.0" text-anchor="middle" font-size="13" fill="#f2f2f2">list / describe</text><text x="385.0" y="430.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">print via event queue</text><line x1="230" y1="102" x2="288" y2="102" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="230" y1="102" x2="288" y2="276" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="230" y1="102" x2="288" y2="346" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="230" y1="102" x2="288" y2="416" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="540" y="54" width="380" height="150" fill="none" stroke="#ff4f00" stroke-dasharray="4 4"/><text x="554" y="74" font-size="11" fill="#ff6a2b" text-anchor="start">multiprocessing.Pool(cpu_count)</text><rect x="560" y="84" width="165" height="44" fill="#111113" stroke="#3a3a40"/><text x="642.5" y="103.0" text-anchor="middle" font-size="13" fill="#f2f2f2">grayscale</text><text x="642.5" y="120.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">weighted luminance</text><rect x="735" y="84" width="165" height="44" fill="#111113" stroke="#3a3a40"/><text x="817.5" y="103.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Gaussian blur</text><text x="817.5" y="120.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">convolution kernel</text><rect x="560" y="140" width="165" height="44" fill="#111113" stroke="#3a3a40"/><text x="642.5" y="159.0" text-anchor="middle" font-size="13" fill="#f2f2f2">brightness</text><text x="642.5" y="176.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">factor 2.0</text><rect x="735" y="140" width="165" height="44" fill="#111113" stroke="#3a3a40"/><text x="817.5" y="159.0" text-anchor="middle" font-size="13" fill="#f2f2f2">save result</text><text x="817.5" y="176.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">new image file</text><line x1="480" y1="102" x2="538" y2="102" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="509" y="94" text-anchor="middle" font-size="10.5" fill="#ff6a2b">apply</text><rect x="540" y="250" width="380" height="192" fill="#1a0f09" stroke="#ff4f00"/><text x="730.0" y="335.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Image registry</text><text x="730.0" y="352.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">original or processed · parent images</text><text x="730.0" y="367.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">tasks used · size before / after · delete flag</text><line x1="730" y1="204" x2="730" y2="248" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="740" y="232" text-anchor="start" font-size="10.5" fill="#ff6a2b">new image, Task: Finished</text><line x1="480" y1="276" x2="538" y2="276" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="509" y="268" text-anchor="middle" font-size="10.5" fill="#8d8d94">add</text><line x1="480" y1="346" x2="538" y2="346" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="509" y="338" text-anchor="middle" font-size="10.5" fill="#8d8d94">remove</text><line x1="538" y1="416" x2="482" y2="416" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="509" y="408" text-anchor="middle" font-size="10.5" fill="#8d8d94">read</text><text x="30" y="478" text-anchor="start" font-size="10.5" fill="#8d8d94">Finished task ids go to a completed-tasks queue that a taskCompleted thread drains;</text><text x="30" y="496" text-anchor="start" font-size="10.5" fill="#8d8d94">threading.Condition keeps delete waiting until filtering is done.</text></g></svg>
