<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">CATAPP · UNIDIRECTIONAL DATA FLOW</text><rect x="30" y="60" width="250" height="360" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="44" y="80" font-size="11" fill="#8d8d94" text-anchor="start">UI (Jetpack Compose)</text><rect x="50" y="90" width="210" height="52" fill="#111113" stroke="#3a3a40"/><text x="155.0" y="113.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Breed list</text><text x="155.0" y="130.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">with search</text><rect x="50" y="154" width="210" height="52" fill="#111113" stroke="#3a3a40"/><text x="155.0" y="177.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Breed details</text><text x="155.0" y="194.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">stats, traits</text><rect x="50" y="218" width="210" height="52" fill="#111113" stroke="#3a3a40"/><text x="155.0" y="241.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Gallery</text><text x="155.0" y="258.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">photos per breed</text><rect x="50" y="282" width="210" height="52" fill="#111113" stroke="#3a3a40"/><text x="155.0" y="305.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Photo viewer</text><text x="155.0" y="322.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">full screen</text><rect x="50" y="346" width="210" height="52" fill="#111113" stroke="#3a3a40"/><text x="155.0" y="369.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Profile setup</text><text x="155.0" y="386.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">first launch</text><rect x="340" y="84" width="200" height="72" fill="#1a0f09" stroke="#ff4f00"/><text x="440.0" y="109.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ViewModel</text><text x="440.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">StateFlow&lt;State&gt;</text><text x="440.0" y="141.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">reducer: setState { copy() }</text><line x1="262" y1="110" x2="338" y2="110" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="300" y="102" text-anchor="middle" font-size="10.5" fill="#8d8d94">events</text><path d="M340 140 C 305 150, 290 170, 262 180" fill="none" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="300" y="190" text-anchor="start" font-size="10.5" fill="#ff6a2b">state</text><rect x="340" y="220" width="200" height="60" fill="#111113" stroke="#3a3a40"/><text x="440.0" y="247.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Repository</text><text x="440.0" y="264.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">CatBreedsRepository</text><line x1="440" y1="156" x2="440" y2="218" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="610" y="84" width="220" height="60" fill="#111113" stroke="#3a3a40"/><text x="720.0" y="111.0" text-anchor="middle" font-size="13" fill="#f2f2f2">TheCatAPI</text><text x="720.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">Retrofit + OkHttp</text><rect x="610" y="220" width="220" height="60" fill="#1a0f09" stroke="#ff4f00"/><text x="720.0" y="247.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Room</text><text x="720.0" y="264.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">cached breeds, Flow</text><rect x="610" y="340" width="220" height="60" fill="#111113" stroke="#3a3a40"/><text x="720.0" y="367.0" text-anchor="middle" font-size="13" fill="#f2f2f2">DataStore</text><text x="720.0" y="384.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">profile, db-ready flag</text><line x1="540" y1="232" x2="608" y2="130" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="580" y="200" text-anchor="start" font-size="10.5" fill="#8d8d94">first launch</text><line x1="720" y1="144" x2="720" y2="218" stroke="#5c5c63" stroke-width="1.3" marke