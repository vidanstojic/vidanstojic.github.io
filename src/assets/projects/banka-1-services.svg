en services</text><rect x="230" y="450" width="190" height="56" fill="#111113" stroke="#3a3a40"/><text x="325.0" y="475.0" text-anchor="middle" font-size="13" fill="#f2f2f2">notification-service</text><text x="325.0" y="492.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">emails to users</text><line x1="545" y1="410" x2="545" y2="448" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="765" y1="410" x2="765" y2="448" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><path d="M765 506 L 765 530 L 325 530 L 325 508" fill="none" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="545" y="546" text-anchor="middle" font-size="10.5" fill="#ff6a2b">notification queue</text><rect x="30" y="450" width="150" height="56" fill="#111113" stroke="#3a3a40"/><text x="105.0" y="467.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Observability</text><text x="105.0" y="484.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">OTel, Prometheus,</text><text x="105.0" y="499.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">Grafana, Loki, Jaeger</text><path d="M430 395 C 300 395, 140 400, 105 448" fill="none" stroke="#5c5c63" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="190" y="440" text-anchor="start" font-size="10.5" fill="#8d8d94">metrics, logs, traces</text></g></svg>
