<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="ProductivityBuddy modules: the scanner polls processes through OSHI into a shared registry, the analytics engine sums time per category and writes CSV snapshots, and the JavaFX view shows it live">
<title>ProductivityBuddy modules: the scanner polls processes through OSHI into a shared registry, the analytics engine sums time per category and writes CSV snapshots, and the JavaFX view shows it live</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1L11 6L1 11z" fill="#0a0a0a" stroke="#5c5c63" stroke-width="1.2"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="960" height="560" fill="#0a0a0a"/><rect width="960" height="560" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">PRODUCTIVITYBUDDY · MAVEN MODULES</text><rect x="20" y="54" width="280" height="230" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="34" y="74" font-size="11" fill="#8d8d94" text-anchor="start">scanner-module</text><rect x="40" y="88" width="240" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="160.0" y="109.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ProcessScanner</text><text x="160.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">OSHI, every N ms</text><text x="160.0" y="141.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">one scheduled thread</text><rect x="40" y="196" width="240" height="64" fill="#111113" stroke="#3a3a40"/><text x="160.0" y="217.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ForkJoinPool</text><text x="160.0" y="234.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">ScanTask splits the</text><text x="160.0" y="249.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">process list in halves</text><line x1="160" y1="152" x2="160" y2="194" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="330" y="54" width="290" height="230" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="344" y="74" font-size="11" fill="#8d8d94" text-anchor="start">data-service</text><rect x="350" y="88" width="250" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="475.0" y="109.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ProcessRegistry</text><text x="475.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">live processes, time,</text><text x="475.0" y="141.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">category, alias, frozen</text><rect x="350" y="196" width="120" height="64" fill="#111113" stroke="#3a3a40"/><text x="410.0" y="225.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ConfigLoader</text><text x="410.0" y="242.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">interval</text><rect x="480" y="196" width="120" height="64" fill="#111113" stroke="#3a3a40"/><text x="540.0" y="225.0" text-anchor="middle" font-size="13" fill="#f2f2f2">JsonService</text><text x="540.0" y="242.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">state as JSON</text><line x1="282" y1="228" x2="348" y2="128" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="290" y="168" text-anchor="start" font-size="10.5" fill="#8d8d94">add / update,</text><text x="290" y="183" text-anchor="start" font-size="10.5" fill="#8d8d94">drop dead PIDs</text><rect x="650" y="54" width="290" height="320" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="664" y="74" font-size="11" fill="#8d8d94" text-anchor="start">analytics-engine</text><rect x="670" y="88" width="250" height="64" fill="#111113" stroke="#3a3a40"/><text x="795.0" y="109.0" text-anchor="middle" font-size="13" fill="#f2f2f2">FileExecutorService</text><text x="795.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">CSV snapshots, scheduled</text><text x="795.0" y="141.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">or at chosen times</text><rect x="670" y="186" width="250" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="795.0" y="207.0" text-anchor="middle" font-size="13" fill="#f2f2f2">AnalyticsService</text><text x="795.0" y="224.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">Work / Fun / Other</text><text x="795.0" y="239.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">totals every 5 s</text><rect x="670" y="284" width="250" height="64" fill="#111113" stroke="#3a3a40"/><text x="795.0" y="305.0" text-anchor="middle" font-size="13" fill="#f2f2f2">WatcherService</text><text x="795.0" y="322.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">reloads JSON edited</text><text x="795.0" y="337.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">outside the app</text><line x1="602" y1="110" x2="668" y2="110" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="635" y="102" text-anchor="middle" font-size="10.5" fill="#8d8d94">read</text><line x1="602" y1="140" x2="668" y2="210" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="622" y="190" text-anchor="middle" font-size="10.5" fill="#8d8d94">read</text><rect x="20" y="330" width="600" height="200" fill="none" stroke="#3a3a40" stroke-dasharray="4 4"/><text x="34" y="350" font-size="11" fill="#8d8d94" text-anchor="start">view-module (JavaFX)</text><rect x="40" y="366" width="180" height="64" fill="#111113" stroke="#3a3a40"/><text x="130.0" y="395.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Category views</text><text x="130.0" y="412.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">tag, alias, freeze</text><rect x="230" y="366" width="180" height="64" fill="#111113" stroke="#3a3a40"/><text x="320.0" y="395.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ProcessDetailView</text><text x="320.0" y="412.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">CPU, RAM, time</text><rect x="420" y="366" width="180" height="64" fill="#111113" stroke="#3a3a40"/><text x="510.0" y="395.0" text-anchor="middle" font-size="13" fill="#f2f2f2">MainChartView</text><text x="510.0" y="412.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">live chart</text><rect x="40" y="450" width="560" height="52" fill="#111113" stroke="#3a3a40"/><text x="320.0" y="473.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Controllers</text><text x="320.0" y="490.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">save · load · exit (state written to JSON on exit)</text><line x1="475" y1="154" x2="475" y2="328" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="485" y="300" text-anchor="start" font-size="10.5" fill="#8d8d94">processes</text><line x1="668" y1="240" x2="602" y2="372" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="640" y="320" text-anchor="start" font-size="10.5" fill="#ff6a2b">totals</text><rect x="670" y="430" width="250" height="64" fill="#111113" stroke="#3a3a40"/><text x="795.0" y="459.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Files on disk</text><text x="795.0" y="476.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">JSON mapping, CSV snapshots</text><line x1="795" y1="348" x2="795" y2="428" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="805" y="395" text-anchor="start" font-size="10.5" fill="#8d8d94">watch</text><path d="M920 120 L 948 120 L 948 462 L 922 462" fill="none" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/></g></svg>
