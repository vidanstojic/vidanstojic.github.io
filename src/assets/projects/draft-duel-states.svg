<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 400" width="790" height="400" role="img" aria-label="Draft Duel match state machine from waiting to finished, with pause and abandon">
<title>Draft Duel match state machine from waiting to finished, with pause and abandon</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="790" height="400" fill="#0a0a0a"/><rect width="790" height="400" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">DRAFT DUEL · MATCH STATE MACHINE</text><rect x="30" y="90" width="130" height="48" fill="#111113" stroke="#3a3a40"/><text x="95.0" y="118.5" text-anchor="middle" font-size="13" fill="#f2f2f2">WAITING</text><rect x="220" y="90" width="130" height="48" fill="#1a0f09" stroke="#ff4f00"/><text x="285.0" y="118.5" text-anchor="middle" font-size="13" fill="#f2f2f2">DRAWING</text><rect x="420" y="40" width="130" height="48" fill="#1a0f09" stroke="#ff4f00"/><text x="485.0" y="68.5" text-anchor="middle" font-size="13" fill="#f2f2f2">BIDDING</text><rect x="420" y="140" width="130" height="48" fill="#111113" stroke="#3a3a40"/><text x="485.0" y="168.5" text-anchor="middle" font-size="13" fill="#f2f2f2">CHOOSING</text><rect x="620" y="90" width="130" height="48" fill="#1a0f09" stroke="#ff4f00"/><text x="685.0" y="118.5" text-anchor="middle" font-size="13" fill="#f2f2f2">AWARDED</text><rect x="620" y="220" width="130" height="48" fill="#111113" stroke="#3a3a40"/><text x="685.0" y="248.5" text-anchor="middle" font-size="13" fill="#f2f2f2">SCORING</text><rect x="620" y="320" width="130" height="48" fill="#111113" stroke="#3a3a40"/><text x="685.0" y="348.5" text-anchor="middle" font-size="13" fill="#f2f2f2">FINISHED</text><rect x="220" y="320" width="130" height="48" fill="#111113" stroke="#3a3a40"/><text x="285.0" y="348.5" text-anchor="middle" font-size="13" fill="#f2f2f2">PAUSED</text><rect x="30" y="320" width="130" height="48" fill="#111113" stroke="#3a3a40"/><text x="95.0" y="348.5" text-anchor="middle" font-size="13" fill="#f2f2f2">ABANDONED</text><line x1="160" y1="114" x2="218" y2="114" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="189" y="106" text-anchor="middle" font-size="10.5" fill="#8d8d94">2nd player</text><line x1="350" y1="104" x2="418" y2="70" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="360" y="72" text-anchor="start" font-size="10.5" fill="#8d8d94">both can bid</text><line x1="350" y1="124" x2="418" y2="160" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="360" y="168" text-anchor="start" font-size="10.5" fill="#8d8d94">one at 0</text><line x1="550" y1="64" x2="618" y2="104" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="556" y="56" text-anchor="start" font-size="10.5" fill="#8d8d94">pass / over budget</text><line x1="550" y1="164" x2="618" y2="124" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="596" y="162" text-anchor="middle" font-size="10.5" fill="#8d8d94">pick</text><path d="M620 132 C 520 250, 330 250, 290 140" fill="none" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="455" y="238" font-size="10.5" fill="#8d8d94" text-anchor="middle">empty slot left</text><line x1="685" y1="138" x2="685" y2="218" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="695" y="182" text-anchor="start" font-size="10.5" fill="#8d8d94">both have 5</text><line x1="685" y1="268" x2="685" y2="318" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="285" y1="318" x2="285" y2="190" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="295" y="290" text-anchor="start" font-size="10.5" fill="#8d8d94">disconnect</text><line x1="220" y1="344" x2="162" y2="344" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="191" y="336" text-anchor="middle" font-size="10.5" fill="#8d8d94">15 s or resign</text><path d="M485 40 C 485 10, 455 10, 455 38" fill="none" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="470" y="14" font-size="10.5" fill="#8d8d94" text-anchor="middle">raise, timer resets</text></g></svg>