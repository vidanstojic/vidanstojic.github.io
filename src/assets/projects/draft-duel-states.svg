<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="Draft Duel match engine: each card is drawn, then bid on or chosen, awarded or discarded, until the match finishes">
<title>Draft Duel match engine: each card is drawn, then bid on or chosen, awarded or discarded, until the match finishes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1L11 6L1 11z" fill="#0a0a0a" stroke="#5c5c63" stroke-width="1.2"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="860" height="500" fill="#0a0a0a"/><rect width="860" height="500" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">DRAFT DUEL · MATCH ENGINE, ONE CARD AT A TIME</text><rect x="30" y="236" width="170" height="64" fill="#111113" stroke="#3a3a40"/><text x="115.0" y="265.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Draw card</text><text x="115.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">drawRound()</text><rect x="320" y="136" width="210" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="425.0" y="165.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Bidding</text><text x="425.0" y="182.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">opener must bid</text><rect x="320" y="358" width="210" height="64" fill="#111113" stroke="#3a3a40"/><text x="425.0" y="387.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Choosing</text><text x="425.0" y="404.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">rival has 0 points</text><rect x="640" y="236" width="190" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="735.0" y="265.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Awarded</text><text x="735.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">winner pays the price</text><rect x="660" y="30" width="170" height="52" fill="#111113" stroke="#3a3a40"/><text x="745.0" y="53.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Discarded</text><text x="745.0" y="70.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">nobody gets it</text><rect x="640" y="420" width="190" height="56" fill="#111113" stroke="#3a3a40"/><text x="735.0" y="445.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Finished</text><text x="735.0" y="462.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">higher total wins</text><line x1="200" y1="254" x2="318" y2="180" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="232" y="206" text-anchor="start" font-size="10.5" fill="#8d8d94">both have points</text><line x1="200" y1="284" x2="318" y2="376" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="160" y="352" text-anchor="start" font-size="10.5" fill="#8d8d94">one player at 0</text><line x1="200" y1="268" x2="638" y2="268" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="420" y="258" text-anchor="middle" font-size="10.5" fill="#8d8d94">free: both at 0, or one side&#x27;s slots are full</text><path d="M370 136 C 370 98, 420 98, 420 134" fill="none" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="362" y="104" text-anchor="end" font-size="10.5" fill="#8d8d94">raise +1/+2/+3</text><path d="M470 136 C 470 98, 520 98, 520 134" fill="none" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="495" y="72" text-anchor="middle" font-size="10.5" fill="#ff6a2b">hand-over: pay 1, 2, 3…</text><text x="495" y="87" text-anchor="middle" font-size="10.5" fill="#ff6a2b">rival must open</text><line x1="530" y1="180" x2="638" y2="246" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="600" y="192" text-anchor="start" font-size="10.5" fill="#8d8d94">pass · over rival&#x27;s</text><text x="600" y="207" text-anchor="start" font-size="10.5" fill="#8d8d94">budget · timeout</text><line x1="530" y1="150" x2="658" y2="72" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="600" y="152" text-anchor="start" font-size="10.5" fill="#8d8d94">opener skips (food)</text><line x1="530" y1="378" x2="638" y2="292" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="598" y="362" text-anchor="start" font-size="10.5" fill="#8d8d94">assign the card</text><line x1="735" y1="300" x2="735" y2="418" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="745" y="365" text-anchor="start" font-size="10.5" fill="#8d8d94">last card</text><path d="M640 290 C 560 330, 300 330, 140 302" fill="none" stroke="#ff4f00" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#b)"/><text x="420" y="343" text-anchor="middle" font-size="10.5" fill="#ff6a2b">next card (advance)</text></g></svg>
