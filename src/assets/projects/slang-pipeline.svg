<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Slang compiler pipeline from source through ANTLR, AST, type checker and code generator to a stack VM">
<title>Slang compiler pipeline from source through ANTLR, AST, type checker and code generator to a stack VM</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="720" height="400" fill="#0a0a0a"/><rect width="720" height="400" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">SLANG · FROM SOURCE TO VIRTUAL MACHINE</text><rect x="30" y="70" width="150" height="60" fill="#111113" stroke="#3a3a40"/><text x="105.0" y="97.0" text-anchor="middle" font-size="13" fill="#f2f2f2">source</text><text x="105.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">.slang file</text><rect x="200" y="70" width="150" height="60" fill="#111113" stroke="#3a3a40"/><text x="275.0" y="97.0" text-anchor="middle" font-size="13" fill="#f2f2f2">ANTLR parser</text><text x="275.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">concrete syntax tree</text><rect x="370" y="70" width="150" height="60" fill="#111113" stroke="#3a3a40"/><text x="445.0" y="97.0" text-anchor="middle" font-size="13" fill="#f2f2f2">CST → AST</text><text x="445.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">typed AST nodes</text><rect x="540" y="70" width="150" height="60" fill="#111113" stroke="#3a3a40"/><text x="615.0" y="97.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Type checker</text><text x="615.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">scopes, types</text><line x1="180" y1="100" x2="198" y2="100" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="350" y1="100" x2="368" y2="100" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="520" y1="100" x2="538" y2="100" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="540" y="190" width="150" height="60" fill="#111113" stroke="#3a3a40"/><text x="615.0" y="217.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Code generator</text><text x="615.0" y="234.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">per-function bytecode</text><line x1="615" y1="130" x2="615" y2="188" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="370" y="190" width="150" height="60" fill="#111113" stroke="#3a3a40"/><text x="445.0" y="217.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Bytecode</text><text x="445.0" y="234.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">PUSH, CALL, ...</text><line x1="540" y1="220" x2="522" y2="220" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><rect x="30" y="300" width="660" height="64" fill="#1a0f09" stroke="#ff4f00"/><text x="360.0" y="329.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Stack VM</text><text x="360.0" y="346.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">functions as values, closures with upvalues</text><line x1="445" y1="250" x2="445" y2="298" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/></g></svg>