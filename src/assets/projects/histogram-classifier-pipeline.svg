<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Histogram classifier: per-channel RGB histograms of CIFAR-10 images are averaged into one profile per class; a new image takes the class with the highest cosine similarity">
<title>Histogram classifier: per-channel RGB histograms of CIFAR-10 images are averaged into one profile per class; a new image takes the class with the highest cosine similarity</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1L11 6L1 11z" fill="#0a0a0a" stroke="#5c5c63" stroke-width="1.2"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="900" height="420" fill="#0a0a0a"/><rect width="900" height="420" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">HISTOGRAM CLASSIFIER · map / filter / reduce, NO LOOPS</text><text x="30" y="78" text-anchor="start" font-size="10" fill="#8d8d94">TRAINING</text><rect x="30" y="92" width="190" height="70" fill="#111113" stroke="#3a3a40"/><text x="125.0" y="116.0" text-anchor="middle" font-size="13" fill="#f2f2f2">CIFAR-10</text><text x="125.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">10 classes</text><text x="125.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">100 images each</text><rect x="270" y="92" width="220" height="70" fill="#1a0f09" stroke="#ff4f00"/><text x="380.0" y="116.0" text-anchor="middle" font-size="13" fill="#f2f2f2">RGB histogram</text><text x="380.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">8 bins per channel</text><text x="380.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">÷ pixel count</text><rect x="540" y="92" width="170" height="70" fill="#111113" stroke="#3a3a40"/><text x="625.0" y="116.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Class profile</text><text x="625.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">mean of 100</text><text x="625.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">histograms</text><rect x="750" y="92" width="120" height="70" fill="#111113" stroke="#3a3a40"/><text x="810.0" y="124.0" text-anchor="middle" font-size="13" fill="#f2f2f2">×10</text><text x="810.0" y="141.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">profiles</text><line x1="220" y1="127" x2="268" y2="127" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="244" y="119" text-anchor="middle" font-size="10.5" fill="#8d8d94">map</text><line x1="490" y1="127" x2="538" y2="127" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="514" y="119" text-anchor="middle" font-size="10.5" fill="#8d8d94">reduce</text><line x1="710" y1="127" x2="748" y2="127" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><text x="380" y="186" text-anchor="middle" font-size="10.5" fill="#8d8d94">pixel → (r // 32, g // 32, b // 32), accumulated with reduce</text><text x="30" y="240" text-anchor="start" font-size="10" fill="#8d8d94">CLASSIFYING</text><rect x="30" y="254" width="190" height="70" fill="#111113" stroke="#3a3a40"/><text x="125.0" y="286.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Unknown image</text><text x="125.0" y="303.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">e.g. an airplane</text><rect x="270" y="254" width="220" height="70" fill="#111113" stroke="#3a3a40"/><text x="380.0" y="286.0" text-anchor="middle" font-size="13" fill="#f2f2f2">RGB histogram</text><text x="380.0" y="303.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">same function, 3 × 8</text><rect x="540" y="254" width="170" height="70" fill="#1a0f09" stroke="#ff4f00"/><text x="625.0" y="286.0" text-anchor="middle" font-size="13" fill="#f2f2f2">Cosine similarity</text><text x="625.0" y="303.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">24-value vectors</text><rect x="750" y="254" width="120" height="70" fill="#111113" stroke="#3a3a40"/><text x="810.0" y="286.0" text-anchor="middle" font-size="13" fill="#f2f2f2">max</text><text x="810.0" y="303.0" text-anchor="middle" font-size="10.5" fill="#8d8d94">→ class</text><line x1="220" y1="289" x2="268" y2="289" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="490" y1="289" x2="538" y2="289" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="710" y1="289" x2="748" y2="289" stroke="#5c5c63" stroke-width="1.3" marker-end="url(#a)"/><line x1="790" y1="162" x2="640" y2="252" stroke="#ff4f00" stroke-width="1.3" marker-end="url(#b)"/><text x="728" y="214" text-anchor="start" font-size="10.5" fill="#ff6a2b">compare with</text><text x="728" y="229" text-anchor="start" font-size="10.5" fill="#ff6a2b">each profile</text><text x="30" y="370" text-anchor="start" font-size="10.5" fill="#8d8d94">calculate_normalized_bins_histograms → calculate_average_histogram → cosine_similarity → image_classifier</text><text x="30" y="388" text-anchor="start" font-size="10.5" fill="#8d8d94">Lazy iterators process one image at a time instead of loading the whole set.</text></g></svg>
