<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" role="img" aria-label="xv6 shared memory: two processes map the same physical page through a named registry">
<title>xv6 shared memory: two processes map the same physical page through a named registry</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c5c63"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f00"/></marker>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="820" height="490" fill="#0a0a0a"/><rect width="820" height="490" fill="url(#g)"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"><text x="30" y="38" font-size="11" fill="#ff6a2b" text-anchor="start">XV6 · NAMED SHARED MEMORY</text><text x="60" y="80" font-size="11" fill="#8d8d94" text-anchor="start">Process A page table</text><text x="760" y="80" font-size="11" fill="#8d8d94" text-anchor="end">Process B page table</text><rect x="60" y="92" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="150.0" y="113.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x4000</text><rect x="580" y="92" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="670.0" y="113.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x8000</text><rect x="60" y="136" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="150.0" y="157.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x5000</text><rect x="580" y="136" width="180" height="34" fill="#1a0f09" stroke="#ff4f00"/><text x="670.0" y="157.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x9000</text><rect x="60" y="180" width="180" height="34" fill="#1a0f09" stroke="#ff4f00"/><text x="150.0" y="201.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x6000</text><rect x="580" y="180" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="670.0" y="201.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0xA000</text><rect x="60" y="224" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="150.0" y="245.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x7000</text><rect x="580" y="224" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="670.0" y="245.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0xB000</text><rect x="60" y="268" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="150.0" y="289.5" text-anchor="middle" font-size="13" fill="#f2f2f2">VA 0x8000</text><rect x="580" y="268" width="180" height="34" fill="#111113" stroke="#3a3a40"/><text x="67